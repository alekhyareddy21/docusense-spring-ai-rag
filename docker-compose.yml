version: '3.8'

services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: docusense-pgvector
    environment:
      POSTGRES_DB: docusense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
